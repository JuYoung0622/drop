<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>반 공유함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#15171c;--sub:#6b7280;--line:#e5e7eb;--accent:#2f5bff;--soft:#eaf0ff;--red:#e5484d;--redsoft:#fdecec;--amber:#fff7e0;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit}
.hide{display:none!important}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 14px;flex-wrap:wrap}
h1{font-size:23px;font-weight:800;margin:0;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
h1 .dot{width:28px;height:28px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:14px}
.hright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.me{font-size:13px;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;display:flex;align-items:center;gap:6px}
.badge{font-size:10px;font-weight:800;background:var(--ink);color:#fff;border-radius:6px;padding:2px 6px}
.iconbtn{font-size:12px;color:var(--sub);padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:600}
.notice{background:var(--amber);border:1px solid #f3dd96;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.notice .t{flex:1;white-space:pre-wrap;word-break:break-word}
.notice .by{font-size:11px;color:#8a6d1a;white-space:nowrap}
.notice button{color:#a57b00;font-size:12px}
.subjects{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px}
.subj{padding:8px 14px;border-radius:99px;font-size:14px;font-weight:600;color:var(--sub);background:var(--card);border:1px solid var(--line);white-space:nowrap}
.subj.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.subj.add{color:var(--accent);border-style:dashed}
.drop{background:var(--card);border:2px dashed #c9d3ff;border-radius:var(--r);padding:22px 16px;text-align:center;transition:.15s;position:relative;overflow:hidden}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--soft)}
.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.drop .plus{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;line-height:42px;margin:0 auto 8px}
.drop .big{font-size:16px;font-weight:700}.drop .small{font-size:12.5px;color:var(--sub);margin-top:5px}
.note{margin-top:10px;background:var(--card);border-radius:var(--r);padding:12px;display:flex;gap:10px;align-items:flex-end;border:1px solid var(--line)}
.note textarea{flex:1;border:0;resize:none;font-size:15px;outline:none;min-height:24px;max-height:220px;background:transparent;color:var(--ink)}
.btn{background:var(--accent);color:#fff;font-weight:700;border-radius:11px;padding:10px 16px;font-size:14px;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default}.btn.ghost{background:var(--soft);color:var(--accent)}.btn.red{background:var(--red)}
.uploads{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.up{background:var(--card);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:10px;border:1px solid var(--line)}
.up .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up.err{border-color:#f5c2c2;background:var(--redsoft);color:#a01c20}
.spin{width:16px;height:16px;border:2.5px solid var(--soft);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.toolbar{display:flex;align-items:center;gap:8px;margin:22px 0 12px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tab{padding:7px 13px;border-radius:99px;font-size:13px;font-weight:500;color:var(--sub);background:var(--card);border:1px solid var(--line);white-space:nowrap}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{flex:1;min-width:160px;position:relative}
.search input{width:100%;padding:8px 12px 8px 32px;border-radius:99px;border:1px solid var(--line);background:var(--card);outline:none;font-size:14px}
.search input:focus{border-color:var(--accent)}
.search:before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-52%);color:var(--sub)}
.selbtn{font-size:14px;font-weight:600;color:var(--accent);padding:8px 4px}
.mine{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:5px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
.item{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative;display:flex;flex-direction:column}
.item.sel{outline:3px solid var(--accent);outline-offset:-1px}
.thumb{aspect-ratio:4/3;background:#eef0f4;display:grid;place-items:center;overflow:hidden;cursor:pointer;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ficon{width:52px;height:62px;border-radius:8px;background:#fff;border:1.5px solid #d6dae3;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--accent)}
.codepeek{position:absolute;inset:0;padding:10px;font:11px/1.45 "JetBrains Mono",monospace;color:#334;white-space:pre;overflow:hidden;text-align:left;background:#fbfbfd;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.kind{position:absolute;top:8px;right:8px;font-size:10px;font-weight:800;background:rgba(21,23,28,.75);color:#fff;border-radius:6px;padding:2px 6px}
.notebody{padding:13px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;flex:1;max-height:180px;overflow:hidden;cursor:pointer;color:#333}
.notebody a{color:var(--accent)}
.item.isnote{grid-column:span 2}
.meta{padding:9px 11px 4px;font-size:12px;color:var(--sub);cursor:default}
.meta .name{color:var(--ink);font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px}
.meta .who{color:var(--accent);font-weight:700}
.meta .sj{display:inline-block;background:#f1f3f7;border-radius:5px;padding:0 5px;margin-right:4px;color:#555}
.acts{display:flex;border-top:1px solid var(--line);margin-top:auto}
.acts button{flex:1;padding:10px 0;font-size:13px;font-weight:600;color:var(--accent)}
.acts button+button{border-left:1px solid var(--line)}
.acts button.del{color:var(--red);flex:0 0 52px}
.check{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.95);border:2px solid #c3c8d2;display:none;place-items:center;font-size:14px;color:#fff;z-index:2}
.selecting .check{display:grid}.item.sel .check{background:var(--accent);border-color:var(--accent)}
.empty{text-align:center;color:var(--sub);padding:46px 10px;font-size:14px}
.selbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(150%);background:var(--ink);color:#fff;border-radius:16px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:.2s;z-index:20;width:min(560px,calc(100% - 24px))}
.selbar.show{transform:translateX(-50%) translateY(0)}.selbar .cnt{flex:1;font-weight:600;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(10,12,18,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.dlg{background:#fff;border-radius:18px;padding:22px;width:min(420px,100%);max-height:88vh;overflow:auto}
.dlg h3{margin:0 0 8px;font-size:17px}.dlg p{margin:0 0 14px;color:var(--sub);font-size:14px;line-height:1.5}
.dlg input,.dlg textarea,.dlg select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;font-size:15px;outline:none;background:#fff}
.dlg input:focus,.dlg textarea:focus{border-color:var(--accent)}
.dlg .row{display:flex;gap:8px;justify-content:flex-end}
.trow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.trow .nm{flex:1;min-width:0}.trow .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .nm span{color:var(--sub);font-size:12px}
.viewer{background:#fff;border-radius:18px;width:min(980px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.viewer .vhead{padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center}
.viewer .vhead span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer .vbody{overflow:auto;flex:1}
.viewer img,.viewer video{display:block;max-width:100%;max-height:78vh;margin:0 auto}
.viewer pre{margin:0;padding:16px 18px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;font-family:inherit}
.viewer pre.code{font:13px/1.55 "JetBrains Mono",monospace;white-space:pre;word-break:normal;counter-reset:ln}
.viewer pre.code .ln{display:block}
.viewer pre.code .ln:before{counter-increment:ln;content:counter(ln);display:inline-block;width:3em;margin-right:1em;text-align:right;color:#b4b9c4;user-select:none}
.viewer .vbar{display:flex;gap:8px;justify-content:flex-end;padding:10px;border-top:1px solid var(--line)}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-200%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;transition:.2s;max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0)}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gcard{background:#fff;border-radius:22px;padding:28px 24px;width:min(380px,100%);text-align:center;box-shadow:0 20px 50px rgba(20,30,60,.08)}
.gcard .dot{width:52px;height:52px;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:22px;margin:0 auto 14px}
.gcard h2{margin:0 0 6px;font-size:22px}.gcard p{margin:0 0 16px;color:var(--sub);font-size:14px}
.gcard input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;outline:none;text-align:center;margin-bottom:8px}
.gcard input:focus{border-color:var(--accent)}
.gcard .btn{width:100%;margin-top:6px;padding:13px}
.gcard label{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--sub);margin-top:12px}
.gcard .seg{display:flex;background:#f1f3f7;border-radius:12px;padding:4px;margin-bottom:14px}
.gcard .seg button{flex:1;padding:8px;border-radius:9px;font-size:14px;font-weight:600;color:var(--sub)}
.gcard .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.gerr{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.ghint{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
</style>
</head>
<body>
<!-- 1단계: 반 입장 코드 -->
<div class="gate" id="gate1">
  <form class="gcard" id="codeForm">
    <div class="dot">↕</div><h2>반 공유함</h2><p>반 입장 코드를 입력하세요</p>
    <input type="password" id="code" autocomplete="off" autofocus>
    <button class="btn" type="submit" id="codeBtn">입장</button>
    <label><input type="checkbox" id="rememberCode" style="width:auto;margin:0"> 이 기기에서 기억하기</label>
    <div class="gerr" id="codeErr"></div>
  </form>
</div>
<!-- 2단계: 로그인 / 가입 -->
<div class="gate hide" id="gate2">
  <form class="gcard" id="authForm">
    <div class="dot">👤</div><h2 id="authTitle">로그인</h2>
    <div class="seg"><button type="button" class="on" data-m="login">로그인</button><button type="button" data-m="signup">처음이에요</button></div>
    <input id="nick" placeholder="닉네임 (2~12자)" autocomplete="username" maxlength="12">
    <input type="password" id="upw" placeholder="비밀번호 (4자 이상)" autocomplete="current-password">
    <input type="password" id="upw2" placeholder="비밀번호 확인" class="hide" autocomplete="new-password">
    <button class="btn" type="submit" id="authBtn">로그인</button>
    <div class="gerr" id="authErr"></div>
    <div class="ghint">다른 사이트에서 쓰는 비밀번호는 쓰지 마세요.<br>닉네임: 한글·영문·숫자·점·하이픈</div>
  </form>
</div>

<div class="wrap hide" id="app">
  <header>
    <h1><span class="dot">↕</span>반 공유함</h1>
    <div class="hright">
      <span class="me" id="meChip"></span>
      <button class="iconbtn" id="trashBtn">휴지통</button>
      <button class="iconbtn hide" id="noticeBtn">공지 쓰기</button>
      <button class="iconbtn" id="logoutBtn">로그아웃</button>
    </div>
  </header>
  <div id="notices"></div>
  <div class="subjects" id="subjects"></div>
  <div class="drop" id="drop">
    <div class="plus">+</div>
    <div class="big" id="dropTitle">파일 올리기</div>
    <div class="small">눌러서 선택 · 끌어다 놓기 · PC에선 Ctrl+V · 파일당 50MB까지</div>
    <input type="file" id="picker" multiple aria-label="파일 선택">
  </div>
  <div class="note">
    <textarea id="noteIn" rows="1" placeholder="글·링크·코드 조각 붙여넣기"></textarea>
    <button class="btn" id="noteBtn" disabled>저장</button>
  </div>
  <div class="uploads" id="uploads"></div>
  <div class="toolbar">
    <div class="tabs" id="tabs">
      <button class="tab on" data-f="all">전체</button><button class="tab" data-f="code">코드</button><button class="tab" data-f="doc">문서</button><button class="tab" data-f="image">사진</button><button class="tab" data-f="video">영상</button><button class="tab" data-f="file">기타</button><button class="tab" data-f="note">글</button>
    </div>
    <div class="search"><input id="q" placeholder="파일명·닉네임·글 검색"></div>
    <label class="mine"><input type="checkbox" id="onlyMine"> 내 것만</label>
    <button class="selbtn" id="selToggle">선택</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">불러오는 중…</div>
</div>

<div class="selbar" id="selbar"><span class="cnt" id="selCnt">0개 선택</span><button class="btn ghost" id="selDown">받기</button><button class="btn red" id="selDel">삭제</button></div>
<div class="modal" id="confirm"><div class="dlg"><h3 id="cTitle"></h3><p id="cMsg"></p><div class="row"><button class="btn ghost" id="cNo">취소</button><button class="btn red" id="cYes">확인</button></div></div></div>
<div class="modal" id="prompt"><div class="dlg"><h3 id="pTitle"></h3><p id="pMsg"></p><textarea id="pIn" rows="3"></textarea><div class="row"><button class="btn ghost" id="pNo">취소</button><button class="btn" id="pYes">확인</button></div></div></div>
<div class="modal" id="trash"><div class="dlg" style="width:min(560px,100%)"><h3>휴지통</h3><p>최근 지워진 항목이에요. 올린 사람이나 관리자가 되살릴 수 있어요.</p><div id="trashList">불러오는 중…</div><div class="row" style="margin-top:12px"><button class="btn ghost" id="trashX">닫기</button></div></div></div>
<div class="modal" id="viewModal"><div class="viewer" id="viewer"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  const done=v=>{ $('confirm').classList.remove('show'); $('cYes').onclick=$('cNo').onclick=null; res(v); }; $('cYes').onclick=()=>done(true); $('cNo').onclick=()=>done(false); }); }
function promptBox(title,msg,val=''){ return new Promise(res=>{ $('pTitle').textContent=title; $('pMsg').textContent=msg; $('pIn').value=val; $('prompt').classList.add('show'); setTimeout(()=>$('pIn').focus(),50);
  const done=v=>{ $('prompt').classList.remove('show'); $('pYes').onclick=$('pNo').onclick=null; res(v); }; $('pYes').onclick=()=>done($('pIn').value.trim()); $('pNo').onclick=()=>done(null); }); }
const stamp=()=>{ const d=new Date(), p=n=>String(n).padStart(2,'0'); return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds()); };
const rid=()=>Math.random().toString(36).slice(2,6);
function parseTime(s){ const m=/^(\d{4})(\d\d)(\d\d)-(\d\d)(\d\d)(\d\d)/.exec(s||''); return m?new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime():0; }
const cleanName=s=>s.replace(/[\\\/:*?"<>|_]/g,'-').trim();
const NICK_RE=/^[가-힣A-Za-z0-9.\-]{2,12}$/;
const isAdmin=()=>ROLE==='admin';

// ---------- GitHub API ----------
async function gh(path,opt={}){
  const r=await fetch('https://api.github.com'+path,{cache:'no-store',...opt,headers:{'Authorization':'Bearer '+TOKEN,'Accept':opt.raw?'application/vnd.github.raw':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(!r.ok){ const e=new Error('GitHub '+r.status); e.status=r.status; throw e; }
  return opt.raw?r.blob():(r.status===204?null:r.json());
}
const encP=p=>p.split('/').map(encodeURIComponent).join('/');
const C=p=>`/repos/${OWNER}/${REPO}/contents/${encP(p)}`;
function fileB64(blob){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]||''); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(blob); }); }
async function readJson(path,def){ try{ const m=await gh(C(path)+'?ref='+BRANCH); return {data:JSON.parse(new TextDecoder().decode(ub64(m.content.replace(/\n/g,'')))),sha:m.sha}; }catch(e){ if(e.status===404) return {data:def,sha:null}; throw e; } }
async function updateJson(path,def,mutate,msg){ // 동시 수정 충돌 시 재시도
  for(let i=0;i<4;i++){ const {data,sha}=await readJson(path,def); const nd=mutate(JSON.parse(JSON.stringify(data))); if(nd===undefined) return data;
    try{ await gh(C(path),{method:'PUT',body:JSON.stringify({message:msg,content:b64(enc.encode(JSON.stringify(nd,null,1))),branch:BRANCH,...(sha?{sha}:{})})}); return nd; }
    catch(e){ if(e.status!==409&&e.status!==422) throw e; await new Promise(r=>setTimeout(r,400+Math.random()*600)); } }
  throw new Error('충돌');
}

// ---------- 1단계: 입장 코드 ----------
async function unlockCode(code){ const k=await pbk(code,ub64(VAULT.s),VAULT.i,'decrypt'); return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(VAULT.v)},k,ub64(VAULT.c))); }
$('codeForm').addEventListener('submit',async e=>{ e.preventDefault(); $('codeErr').textContent=''; $('codeBtn').disabled=true; $('codeBtn').textContent='확인 중…';
  try{ TOKEN=await unlockCode($('code').value.trim()); if($('rememberCode').checked){ try{localStorage.setItem('cls_t',TOKEN);}catch(_){ } } toGate2(); }
  catch(_){ $('codeErr').textContent='입장 코드가 틀렸어요.'; }
  $('codeBtn').disabled=false; $('codeBtn').textContent='입장'; });
function toGate2(){ $('gate1').classList.add('hide');
  try{ const u=JSON.parse(localStorage.getItem('cls_u')||'null'); if(u&&u.nick){ return loginAs(u.nick); } }catch(_){ }
  $('gate2').classList.remove('hide'); $('nick').focus(); }

// ---------- 2단계: 로그인 / 가입 ----------
let mode='login';
document.querySelectorAll('#authForm .seg button').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; document.querySelectorAll('#authForm .seg button').forEach(x=>x.classList.toggle('on',x===b));
  $('upw2').classList.toggle('hide',mode!=='signup'); $('authTitle').textContent=$('authBtn').textContent=mode==='signup'?'가입하기':'로그인'; $('authErr').textContent=''; });
$('authForm').addEventListener('submit',async e=>{ e.preventDefault(); $('authErr').textContent='';
  const nick=$('nick').value.trim(), pw=$('upw').value;
  if(!NICK_RE.test(nick)) return $('authErr').textContent='닉네임은 2~12자, 한글·영문·숫자·점·하이픈만 돼요.';
  if(pw.length<4) return $('authErr').textContent='비밀번호는 4자 이상이에요.';
  $('authBtn').disabled=true;
  try{
    if(mode==='signup'){
      if(pw!==$('upw2').value){ $('authErr').textContent='비밀번호 확인이 달라요.'; return; }
      const salt=b64(crypto.getRandomValues(new Uint8Array(16))), h=await hashPw(pw,salt); let taken=false;
      await updateJson('users.json',{users:{}},d=>{ if(Object.keys(d.users).some(k=>k.toLowerCase()===nick.toLowerCase())){ taken=true; return undefined; } d.users[nick]={s:salt,h,role:'member',t:Date.now()}; return d; },'signup|'+nick);
      if(taken){ $('authErr').textContent='이미 있는 닉네임이에요.'; return; }
    } else {
      const {data}=await readJson('users.json',{users:{}}); const u=data.users[nick];
      if(!u||await hashPw(pw,u.s)!==u.h){ $('authErr').textContent='닉네임이나 비밀번호가 틀렸어요.'; return; }
    }
    try{ localStorage.setItem('cls_u',JSON.stringify({nick})); }catch(_){ }
    await loginAs(nick);
  }catch(err){ if(err.status===401) return resetAll(); $('authErr').textContent='오류가 났어요 ('+(err.status||err.message)+')'; }
  finally{ $('authBtn').disabled=false; }
});
async function loginAs(nick){
  const {data}=await readJson('users.json',{users:{}}).catch(e=>{ if(e.status===401) resetAll(); throw e; }); users=data.users;
  if(!users[nick]){ try{localStorage.removeItem('cls_u');}catch(_){ } $('gate2').classList.remove('hide'); return; }
  ME=nick; ROLE=users[nick].role||'member';
  $('gate2').classList.add('hide'); $('app').classList.remove('hide');
  $('meChip').innerHTML=esc(ME)+(isAdmin()?' <span class="badge">관리자</span>':'');
  $('noticeBtn').classList.toggle('hide',!isAdmin());
  loadAll();
}
function resetAll(){ try{ localStorage.removeItem('cls_t'); localStorage.removeItem('cls_u'); }catch(_){ } location.reload(); }
$('logoutBtn').onclick=()=>{ try{ localStorage.removeItem('cls_u'); }catch(_){ } location.reload(); };
try{ const t=localStorage.getItem('cls_t'); if(t){ TOKEN=t; toGate2(); } }catch(_){ }

// ---------- 데이터 ----------
async function loadAll(){ await Promise.all([loadMeta(),load()]); }
async function loadMeta(){
  try{ const [s,n]=await Promise.all([readJson('subjects.json',['기타']),readJson('notices.json',[])]); subjects=s.data.length?s.data:['기타']; notices=n.data; }catch(_){ }
  renderSubjects(); renderNotices();
}
async function load(){
  try{
    const tree=await gh(`/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`);
    items=tree.tree.filter(x=>x.type==='blob'&&(x.path.startsWith('files/')||x.path.startsWith('notes/'))).map(x=>{
      const parts=x.path.split('/');
      if(parts[0]==='notes'){ const [ts,nick]=parts[2].replace(/\.txt$/,'').split('_'); return {path:x.path,sha:x.sha,size:x.size,kind:'note',subj:parts[1],time:parseTime(ts),owner:nick||'',name:'글'}; }
      const [ts,nick]=parts[2].split('_'); const name=parts.slice(3).join('/'), ext=extOf(name);
      return {path:x.path,sha:x.sha,size:x.size,kind:kindOf(ext),ext,subj:parts[1],time:parseTime(ts),owner:nick||'',name};
    }).sort((a,b)=>b.time-a.time);
  }catch(e){ if(e.status===401) return resetAll(); if(e.status===404||e.status===409) items=[]; else { $('empty').textContent='불러오지 못했어요 ('+(e.status||'네트워크')+')'; return; } }
  for(const id of [...selected]) if(!items.some(i=>i.path===id)) selected.delete(id);
  render(); updateSelbar();
}
const reload=()=>{ load(); setTimeout(load,2500); };

// ---------- 과목 / 공지 ----------
function renderSubjects(){
  const box=$('subjects'); box.innerHTML='';
  for(const s of ['전체',...subjects]){ const b=document.createElement('button'); b.className='subj'+(s===curSubj?' on':''); b.textContent=s; b.onclick=()=>{ curSubj=s; renderSubjects(); render(); }; box.append(b); }
  const add=document.createElement('button'); add.className='subj add'; add.textContent='+ 과목'; add.onclick=addSubject; box.append(add);
  $('dropTitle').textContent=(curSubj==='전체'?'':'['+curSubj+'] ')+'파일 올리기';
}
async function addSubject(){
  const v=await promptBox('과목 추가','예: 자료구조, 경영학원론'); if(!v) return; const name=cleanName(v).slice(0,20); if(!name) return;
  try{ subjects=await updateJson('subjects.json',['기타'],d=>{ if(d.includes(name)) return undefined; d.push(name); return d; },'subject|'+name+'|'+ME) || subjects; if(!subjects.includes(name)) subjects.push(name); curSubj=name; renderSubjects(); render(); }
  catch(e){ toast('추가 실패'); }
}
function renderNotices(){
  $('notices').innerHTML='';
  for(const n of notices){ const d=document.createElement('div'); d.className='notice'; d.innerHTML='<span>📌</span><span class="t">'+linkify(n.text)+'</span><span class="by">'+esc(n.by)+' · '+ago(n.t)+'</span>'+(isAdmin()?'<button>내리기</button>':'');
    if(isAdmin()) d.querySelector('button').onclick=async()=>{ if(!await confirmBox('공지를 내릴까요?','')) return; notices=await updateJson('notices.json',[],a=>a.filter(x=>x.id!==n.id),'notice-del|'+ME); renderNotices(); };
    $('notices').append(d); }
}
$('noticeBtn').onclick=async()=>{ const v=await promptBox('공지 쓰기','맨 위에 고정돼요. 예: 자료구조 과제 금요일 23:59 마감'); if(!v) return;
  try{ notices=await updateJson('notices.json',[],a=>{ a.unshift({id:rid()+Date.now(),text:v.slice(0,500),by:ME,t:Date.now()}); return a; },'notice|'+ME); renderNotices(); }catch(e){ toast('공지 실패'); } };

// ---------- 미리보기 ----------
const blobCache=new Map();
function rawBlob(it){ if(!blobCache.has(it.path)) blobCache.set(it.path,gh(C(it.path)+'?ref='+BRANCH,{raw:true}).catch(e=>{ blobCache.delete(it.path); throw e; })); return blobCache.get(it.path); }
const io=new IntersectionObserver(ents=>{ for(const en of ents){ if(!en.isIntersecting) continue; io.unobserve(en.target); const it=en.target.__it;
  if(it.kind==='image'&&!['heic','heif'].includes(it.ext)&&it.size<15e6) rawBlob(it).then(b=>{ const img=new Image(); img.alt=''; img.src=URL.createObjectURL(b); en.target.prepend(img); en.target.querySelector('.ficon')?.remove(); }).catch(()=>{});
  else if(it.kind==='code'&&it.size<300000) rawBlob(it).then(b=>b.text()).then(t=>{ it.text=t; const p=document.createElement('div'); p.className='codepeek'; p.textContent=t.split('\n').slice(0,14).join('\n'); en.target.prepend(p); en.target.querySelector('.ficon')?.remove(); }).catch(()=>{});
  else if(it.kind==='note') rawBlob(it).then(b=>b.text()).then(t=>{ it.text=t; en.target.innerHTML=linkify(t); }).catch(()=>{ en.target.textContent='(불러오기 실패)'; });
} },{rootMargin:'200px'});

const canDel=it=>isAdmin()||it.owner===ME;
function visible(){
  const q=query.toLowerCase();
  return items.filter(i=>(curSubj==='전체'||i.subj===curSubj)&&(filter==='all'||i.kind===filter)&&(!onlyMine||i.owner===ME)&&
    (!q||i.name.toLowerCase().includes(q)||i.owner.toLowerCase().includes(q)||i.subj.toLowerCase().includes(q)||(i.text&&i.text.toLowerCase().includes(q))));
}
function render(){
  const g=$('grid'); g.innerHTML=''; const list=visible();
  $('empty').style.display=list.length?'none':'block';
  $('empty').textContent=items.length?'조건에 맞는 항목이 없어요.':'아직 아무것도 없어요. 위에서 올려보세요.';
  for(const it of list){
    const el=document.createElement('div'); el.className='item'+(it.kind==='note'?' isnote':'')+(selected.has(it.path)?' sel':'');
    const label={code:'코드',doc:'문서',image:'',video:'영상',file:''}[it.kind]||'';
    const top=it.kind==='note'?'<div class="notebody">'+(it.text!=null?linkify(it.text):'…')+'</div>'
      :'<div class="thumb"><div class="ficon">'+esc((it.ext||'FILE').slice(0,4).toUpperCase())+'</div>'+(label?'<span class="kind">'+label+'</span>':'')+'</div>';
    el.innerHTML='<span class="check">✓</span>'+top+'<div class="meta">'+(it.kind!=='note'?'<div class="name" title="'+esc(it.name)+'">'+esc(it.name)+'</div>':'')+
      '<span class="sj">'+esc(it.subj)+'</span><span class="who">'+esc(it.owner)+'</span> · '+ago(it.time)+(it.kind!=='note'?' · '+fmt(it.size):'')+'</div>'+
      '<div class="acts">'+(it.kind==='note'||it.kind==='code'?'<button data-a="copy">복사</button>':'')+'<button data-a="down">받기</button>'+(canDel(it)?'<button class="del" data-a="del">삭제</button>':'')+'</div>';
    const lazy=el.querySelector(it.kind==='note'?'.notebody':'.thumb'); lazy.__it=it;
    if((it.kind==='note'&&it.text==null)||it.kind==='image'||it.kind==='code') io.observe(lazy);
    el.addEventListener('click',e=>{ const a=e.target.closest('[data-a]');
      if(selecting&&!a){ selected.has(it.path)?selected.delete(it.path):selected.add(it.path); el.classList.toggle('sel'); updateSelbar(); return; }
      if(!a){ if(e.target.closest('.thumb,.notebody')&&!e.target.closest('a')) openView(it); return; }
      if(a.dataset.a==='copy') copyText(it); else if(a.dataset.a==='down') download(it); else askDelete([it]); });
    g.append(el);
  }
}
function updateSelbar(){ $('selCnt').textContent=selected.size+'개 선택'; $('selbar').classList.toggle('show',selecting); }

// ---------- 올리기 ----------
async function pickSubject(){ if(curSubj!=='전체') return curSubj;
  if(subjects.length===1) return subjects[0];
  const v=await promptBox('어느 과목에 올릴까요?','과목: '+subjects.join(', ')+'\n(새 이름을 쓰면 새 과목이 생겨요)',subjects[0]); if(!v) return null;
  const name=cleanName(v).slice(0,20); if(!subjects.includes(name)){ try{ subjects=await updateJson('subjects.json',['기타'],d=>{ if(d.includes(name)) return undefined; d.push(name); return d; },'subject|'+name+'|'+ME)||subjects; }catch(_){ } if(!subjects.includes(name)) subjects.push(name); renderSubjects(); }
  return name; }
let queue=Promise.resolve();
async function uploadFiles(files){ if(!files.length) return; const subj=await pickSubject(); if(!subj) return;
  for(const f of files) queue=queue.then(()=>uploadOne(f,subj)); queue.then(reload); }
async function uploadOne(f,subj){
  const row=document.createElement('div'); row.className='up'; row.innerHTML='<span class="spin"></span><span class="nm"></span><span class="sz"></span>';
  const name=(f.name||('붙여넣기.'+((f.type.split('/')[1])||'bin'))).replace(/[\\\/:*?"<>|]/g,'_');
  row.querySelector('.nm').textContent='['+subj+'] '+name; row.querySelector('.sz').textContent=fmt(f.size); $('uploads').prepend(row);
  const fail=m=>{ row.className='up err'; row.querySelector('.spin').outerHTML='<span>⚠️</span>'; row.querySelector('.sz').textContent=m; setTimeout(()=>row.remove(),9000); };
  if(f.size>MAXB) return fail('50MB 초과');
  try{ const path=`files/${subj}/${stamp()}_${ME}_${rid()}/${name}`;
    await gh(C(path),{method:'PUT',body:JSON.stringify({message:'upload|'+path+'|'+ME,content:await fileB64(f),branch:BRANCH})}); row.remove(); }
  catch(e){ fail(e.status===413?'너무 큼':'실패 '+(e.status||'')); }
}
$('picker').addEventListener('change',()=>{ uploadFiles([...$('picker').files]); $('picker').value=''; });
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{ e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{ e.preventDefault(); if(ev==='drop'||!e.relatedTarget) $('drop').classList.remove('over'); }));
document.addEventListener('drop',e=>{ if(ME&&e.dataTransfer&&e.dataTransfer.files.length) uploadFiles([...e.dataTransfer.files]); });
document.addEventListener('paste',e=>{ const fs=[...(e.clipboardData&&e.clipboardData.files||[])]; if(ME&&fs.length&&!['noteIn','pIn','q'].includes(document.activeElement.id)){ e.preventDefault(); uploadFiles(fs); } });

// ---------- 글 ----------
const grow=()=>{ const t=$('noteIn'); t.style.height='auto'; t.style.height=Math.min(220,t.scrollHeight)+'px'; $('noteBtn').disabled=!t.value.trim(); };
$('noteIn').addEventListener('input',grow);
$('noteIn').addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) saveNote(); });
$('noteBtn').onclick=saveNote;
async function saveNote(){ const t=$('noteIn').value; if(!t.trim()) return; const subj=await pickSubject(); if(!subj) return; $('noteBtn').disabled=true;
  try{ const path=`notes/${subj}/${stamp()}_${ME}_${rid()}.txt`;
    await gh(C(path),{method:'PUT',body:JSON.stringify({message:'note|'+path+'|'+ME,content:b64(enc.encode(t)),branch:BRANCH})}); $('noteIn').value=''; grow(); reload(); }
  catch(e){ toast('저장 실패 '+(e.status||'')); $('noteBtn').disabled=false; } }

// ---------- 받기 / 복사 / 보기 ----------
function saveAs(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000); }
async function download(it){ try{ toast('받는 중…'); saveAs(await rawBlob(it),it.kind==='note'?(it.subj+'-'+it.owner+'-'+new Date(it.time).toISOString().slice(0,10)+'.txt'):it.name); }catch(e){ toast('받기 실패 '+(e.status||'')); } }
async function textOf(it){ return it.text!=null?it.text:(it.text=await (await rawBlob(it)).text()); }
async function copyText(it){ try{ await navigator.clipboard.writeText(await textOf(it)); toast('복사했어요'); }catch(e){ toast('복사가 막혔어요. 열어서 직접 복사해주세요.'); } }
async function openView(it){
  const v=$('viewer'); v.innerHTML='<div class="vhead"><span></span></div><div class="vbody"><pre>불러오는 중…</pre></div>'; v.querySelector('.vhead span').textContent=it.kind==='note'?(it.subj+' · '+it.owner):it.name;
  $('viewModal').classList.add('show'); const body=v.querySelector('.vbody');
  try{
    if(it.kind==='note'){ body.innerHTML='<pre>'+linkify(await textOf(it))+'</pre>'; }
    else if(it.kind==='code'){ const t=await textOf(it); const lang=CODE[it.ext]; let html;
      try{ html=(lang&&lang!=='plaintext'&&window.hljs&&hljs.getLanguage(lang))?hljs.highlight(t,{language:lang}).value:esc(t); }catch(_){ html=esc(t); }
      body.innerHTML='<pre class="code hljs">'+html.split('\n').map(l=>'<span class="ln">'+(l||' ')+'</span>').join('')+'</pre>'; }
    else if(it.kind==='image'&&!['heic','heif'].includes(it.ext)){ const img=new Image(); img.src=URL.createObjectURL(await rawBlob(it)); body.innerHTML=''; body.append(img); }
    else if(it.kind==='video'&&['mp4','webm','m4v','mov'].includes(it.ext)){ const vd=document.createElement('video'); vd.controls=true; vd.playsInline=true; vd.src=URL.createObjectURL(await rawBlob(it)); body.innerHTML=''; body.append(vd); }
    else if(it.ext==='pdf'){ const fr=document.createElement('iframe'); fr.style.cssText='width:100%;height:78vh;border:0'; fr.src=URL.createObjectURL(new Blob([await rawBlob(it)],{type:'application/pdf'})); body.innerHTML=''; body.append(fr); }
    else { $('viewModal').classList.remove('show'); return download(it); }
  }catch(e){ body.innerHTML='<pre>불러오기 실패</pre>'; }
  const bar=document.createElement('div'); bar.className='vbar';
  const mk=(t,c,f)=>{ const b=document.createElement('button'); b.className='btn '+c; b.textContent=t; b.onclick=f; bar.append(b); };
  if(it.kind==='note'||it.kind==='code') mk('복사','ghost',()=>copyText(it));
  mk('받기','ghost',()=>download(it)); mk('닫기','',()=>$('viewModal').classList.remove('show')); v.append(bar);
}
$('viewModal').addEventListener('click',e=>{ if(e.target.id==='viewModal') $('viewModal').classList.remove('show'); });

// ---------- 삭제 / 휴지통 ----------
async function askDelete(list){ list=list.filter(canDel); if(!list.length) return toast('내가 올린 것만 지울 수 있어요');
  if(!await confirmBox(list.length===1?'삭제할까요?':list.length+'개 삭제할까요?','휴지통에서 되살릴 수 있어요.','삭제')) return;
  for(const it of list){ try{ await gh(C(it.path),{method:'DELETE',body:JSON.stringify({message:'delete|'+it.path+'|'+ME,sha:it.sha,branch:BRANCH})}); selected.delete(it.path); }catch(e){ toast('삭제 실패: '+it.name); } }
  reload(); }
$('trashBtn').onclick=openTrash; $('trashX').onclick=()=>$('trash').classList.remove('show');
async function openTrash(){
  $('trash').classList.add('show'); const box=$('trashList'); box.textContent='불러오는 중…';
  try{
    const commits=await gh(`/repos/${OWNER}/${REPO}/commits?sha=${BRANCH}&per_page=100`);
    const alive=new Set(items.map(i=>i.path)), seen=new Set(), rows=[];
    for(const c of commits){ const m=c.commit.message.split('|'); if(m[0]!=='delete'||!m[1]||seen.has(m[1])) continue; seen.add(m[1]); if(alive.has(m[1])) continue;
      const parts=m[1].split('/'), owner=(parts[2]||'').split('_')[1]||''; rows.push({path:m[1],by:m[2]||'',owner,subj:parts[1]||'',when:new Date(c.commit.author.date).getTime(),parent:c.parents[0]&&c.parents[0].sha,
        name:parts[0]==='notes'?'글':parts.slice(3).join('/')}); }
    if(!rows.length){ box.textContent='휴지통이 비어 있어요.'; return; }
    box.innerHTML=''; for(const r of rows){ const d=document.createElement('div'); d.className='trow';
      const can=isAdmin()||r.owner===ME;
      d.innerHTML='<div class="nm"><b></b><span></span></div>'+(can?'<button class="btn ghost">되살리기</button>':'');
      d.querySelector('b').textContent='['+r.subj+'] '+r.name; d.querySelector('span').textContent='올린 사람 '+r.owner+' · '+r.by+'님이 '+ago(r.when)+' 삭제';
      if(can) d.querySelector('button').onclick=async e=>{ e.target.disabled=true; try{ const blob=await gh(C(r.path)+'?ref='+r.parent,{raw:true});
        await gh(C(r.path),{method:'PUT',body:JSON.stringify({message:'restore|'+r.path+'|'+ME,content:await fileB64(blob),branch:BRANCH})}); d.remove(); toast('되살렸어요'); reload(); }
        catch(err){ toast('복구 실패 '+(err.status||'')); e.target.disabled=false; } };
      box.append(d); }
  }catch(e){ box.textContent='불러오지 못했어요 ('+(e.status||'')+')'; }
}

// ---------- 선택 / 필터 ----------
$('selToggle').onclick=()=>{ selecting=!selecting; if(!selecting) selected.clear(); $('selToggle').textContent=selecting?'완료':'선택'; $('app').classList.toggle('selecting',selecting); updateSelbar(); render(); };
$('selDel').onclick=()=>askDelete(items.filter(i=>selected.has(i.path)));
$('selDown').onclick=async()=>{ const list=items.filter(i=>selected.has(i.path)); if(!list.length) return; if(list.length===1) return download(list[0]);
  toast('묶는 중…'); const zip=new JSZip(), used=new Set();
  for(const it of list){ let n=(it.subj+'/')+(it.kind==='note'?(it.owner+'-'+it.sha.slice(0,6)+'.txt'):it.name); while(used.has(n)) n=n.replace(/(\.[^.\/]+)?$/,m=>'-1'+m); used.add(n); try{ zip.file(n,await rawBlob(it)); }catch(e){} }
  saveAs(await zip.generateAsync({type:'blob'}),'반공유함-'+new Date().toISOString().slice(0,10)+'.zip'); };
$('tabs').onclick=e=>{ const b=e.target.closest('.tab'); if(!b) return; filter=b.dataset.f; document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b)); render(); };
let qT; $('q').addEventListener('input',()=>{ clearTimeout(qT); qT=setTimeout(()=>{ query=$('q').value.trim(); render(); },150); });
$('onlyMine').onchange=()=>{ onlyMine=$('onlyMine').checked; render(); };
setInterval(()=>{ if(ME&&!document.hidden) load(); },60000);
})();
</script>
